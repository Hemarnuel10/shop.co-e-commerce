<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <main>

        <!-- Filter Sidebar -->
        <aside>
            <div>
                <h2>Filter</h2>
            </div>
            <hr>

            <!-- Categories -->
            <ul>
                <li><a href="#">T-shirt <i class="bi bi-arrow-right-short"></i></a></li>
                <li><a href="#">Shorts <i class="bi bi-arrow-right-short"></i></a></li>
                <li><a href="#">Shirts <i class="bi bi-arrow-right-short"></i></a></li>
                <li><a href="#">Hoodie <i class="bi bi-arrow-right-short"></i></a></li>
                <li><a href="#">Jeans <i class="bi bi-arrow-right-short"></i></a></li>
            </ul>
            <hr>

            <!-- Price -->
            <div>
                <h3>Price <i class="bi bi-arrow-up-short"></i></h3>
            </div>
            <hr>

            <!-- Colours -->
            <div>
                <h3>Colours <i class="bi bi-arrow-up-short"></i></h3>
            </div>
            <hr>

            <!-- Size -->
            <div>
                <h3>Size <i class="bi bi-arrow-up-short"></i></h3>
            </div>
            <hr>

            <!-- Dress Style -->
            <div>
                <h3>Dress Style <i class="bi bi-arrow-up-short"></i></h3>
                <ul>
                    <li><a href="#">Casual <i class="bi bi-arrow-right-short"></i></a></li>
                    <li><a href="#">Formal <i class="bi bi-arrow-right-short"></i></a></li>
                    <li><a href="#">Party <i class="bi bi-arrow-right-short"></i></a></li>
                    <li><a href="#">Gym <i class="bi bi-arrow-right-short"></i></a></li>
                </ul>
            </div>
            <hr>

            <button>Apply Filter</button>
        </aside>

        <!-- Product Section -->
        <section>
            <div>
                <h2>Casual</h2>
                <div>
                    <p>Showing 1-10 Products</p>
                    <div>
                        Sort by: <button>Most Popular</button>
                    </div>
                </div>
            </div>

            <!-- Product Card -->
            <article>
                <img src="" alt="T-shirt with Tape Details">
                <p>T-shirt with Tape Details</p>
                <div aria-label="5 out of 5 stars">
                    <i class="bi bi-star"></i>
                    <i class="bi bi-star"></i>
                    <i class="bi bi-star"></i>
                    <i class="bi bi-star"></i>
                    <i class="bi bi-star"></i>
                </div>
                <p>$120</p>
            </article>
        </section>

    </main>
</body>
</html>
